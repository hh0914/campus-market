<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300" role="img" aria-label="护眼台灯 国AA级">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf1e9"/>
      <stop offset="0.55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#fbe2d5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#fbe2d5"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#e8622c" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1f2b26" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <circle cx="332" cy="60" r="72" fill="#e8622c" opacity=".07"/>
  <circle cx="66" cy="250" r="52" fill="#e8622c" opacity=".06"/>
  <path d="M0 238 C96 202 152 268 248 234 S360 198 400 216 L400 300 L0 300 Z" fill="#e8622c" opacity=".05"/>
  <ellipse cx="200" cy="260" rx="116" ry="15" fill="#1f2b26" opacity=".07"/>

  <g transform="translate(0 0)"><g filter="url(#shadow)">
    <ellipse cx="186" cy="248" rx="58" ry="13" fill="#fbe2d5" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="186" cy="245" rx="34" ry="7" fill="#fff" opacity=".55"/>
    <path d="M186 240 L186 172 L246 126" fill="none" stroke="#1f2b26" stroke-width="6" stroke-linecap="round"/>
    <circle cx="186" cy="172" r="7" fill="#e8622c" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M232 118 L292 92 L304 140 L244 164 Z" fill="#e8622c" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M246 164 L206 244 L318 244 Z" fill="url(#cone)"/>
    <path d="M240 162 L252 140" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
  </g></g>
  

  <g transform="translate(16 16)">
    <rect width="76" height="25" rx="12.5" fill="#fffdf8" opacity=".92" stroke="#e8622c" stroke-opacity=".28"/>
    <text x="38" y="17" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a8431a" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">校园实拍</text>
  </g>
  <text x="384" y="289" text-anchor="end" font-size="9.5" letter-spacing="1.4" fill="#1f2b26" opacity=".34" font-family="Georgia,serif">校园集 · CAMPUS MARKET</text>
</svg>