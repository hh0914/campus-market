<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300" role="img" aria-label="Kindle Paperwhite 4 8G">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f1"/>
      <stop offset="0.55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#dcece4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#dcece4"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
