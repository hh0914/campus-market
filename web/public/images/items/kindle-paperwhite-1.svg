  <ellipse cx="200" cy="260" rx="116" ry="15" fill="#1f2b26" opacity=".07"/>

  <g transform="translate(0 0)"><g filter="url(#shadow)">
    <rect x="134" y="48" width="132" height="204" rx="14" fill="#3b4541" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="144" y="60" width="112" height="164" rx="5" fill="#f2f0e4"/>
    <g fill="#8f9a91">
