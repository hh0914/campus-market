    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1f2b26" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
