    <rect x="138" y="98" width="8" height="16" rx="3" fill="#8a4f8f"/>
    <rect x="128" y="166" width="24" height="42" rx="4" fill="#f0e0f1"/>
    <rect x="182" y="182" width="58" height="60" rx="10" fill="#fffdf8" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="178" y="170" width="66" height="16" rx="6" fill="#8a4f8f" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="196" y="200" width="30" height="24" rx="3" fill="#f0e0f1"/>
    <rect x="254" y="146" width="42" height="96" rx="8" fill="#fdf7f4" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="262" y="128" width="26" height="18" rx="4" fill="#8a4f8f" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M254 170 L296 158 V180 L254 192 Z" fill="#f0e0f1" stroke="#1f2b26" stroke-width="2"/>
    <circle cx="140" cy="158" r="4" fill="#8a4f8f" opacity=".6"/>
