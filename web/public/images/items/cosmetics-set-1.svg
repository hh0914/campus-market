  <g transform="translate(16 16)">
    <rect width="76" height="25" rx="12.5" fill="#fffdf8" opacity=".92" stroke="#8a4f8f" stroke-opacity=".28"/>
    <text x="38" y="17" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6c3872" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">校园实拍</text>
  </g>
  <text x="384" y="289" text-anchor="end" font-size="9.5" letter-spacing="1.4" fill="#1f2b26" opacity=".34" font-family="Georgia,serif">校园集 · CAMPUS MARKET</text>
