<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 400 300" role="img" aria-label="27 寸 2K 显示器 IPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f1"/>
      <stop offset="0.55" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#dcece4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#dcece4"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#146b52" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#1f2b26" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <circle cx="332" cy="60" r="72" fill="#146b52" opacity=".07"/>
  <circle cx="66" cy="250" r="52" fill="#146b52" opacity=".06"/>
  <path d="M0 238 C96 202 152 268 248 234 S360 198 400 216 L400 300 L0 300 Z" fill="#146b52" opacity=".05"/>
  <ellipse cx="200" cy="260" rx="116" ry="15" fill="#1f2b26" opacity=".07"/>

  <g transform="translate(-56 -34) scale(1.3)"><g filter="url(#shadow)">
    <rect x="92" y="62" width="216" height="140" rx="9" fill="#2c3833" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="101" y="71" width="198" height="122" rx="4" fill="url(#screen)"/>
    <rect x="112" y="82" width="72" height="46" rx="5" fill="#ffffff" opacity=".55"/>
    <rect x="192" y="82" width="96" height="10" rx="5" fill="#146b52" opacity=".35"/>
    <rect x="192" y="100" width="80" height="8" rx="4" fill="#146b52" opacity=".25"/>
    <rect x="192" y="116" width="90" height="8" rx="4" fill="#146b52" opacity=".2"/>
    <rect x="112" y="140" width="176" height="40" rx="5" fill="#146b52" opacity=".14"/>
    <path d="M188 202 H212 L218 238 H182 Z" fill="#3b4742" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="152" y="238" width="96" height="10" rx="5" fill="#3b4742" stroke="#1f2b26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="124" y="258" width="152" height="12" rx="5" fill="#e8ece7" stroke="#1f2b26" stroke-width="2" opacity=".8"/>
  </g></g>
  

  <g transform="translate(16 16)">
    <rect width="76" height="25" rx="12.5" fill="#fffdf8" opacity=".92" stroke="#146b52" stroke-opacity=".28"/>
    <text x="38" y="17" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0d5140" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">成色细节</text>
  </g>
  <text x="384" y="289" text-anchor="end" font-size="9.5" letter-spacing="1.4" fill="#1f2b26" opacity=".34" font-family="Georgia,serif">校园集 · CAMPUS MARKET</text>
