spring:
  datasource:
    url: jdbc:h2:mem:campus_market_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  demo:
    expose-verification-code: true
  upload:
    dir: ./target/test-uploads
  trade:
    platform-fee-rate: 0.02
    payment-timeout-minutes: 30
  credit:
    base-score: 80
    min-publish-threshold: 60
    unlimited-publish-threshold: 90

logging:
  level:
    root: WARN
    com.campusmarket: INFO
    org.springframework: WARN
    org.hibernate: WARN
